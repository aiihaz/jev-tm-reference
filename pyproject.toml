[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "jev-tm-reference"
version = "0.1.0"
description = "Config-driven reference implementation of the a9fix Jev TM evaluation"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
jev-tm = "jev_tm.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
